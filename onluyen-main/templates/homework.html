<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONLUYEN · Chạy bài</title>
<style>
:root{--bg:#0f172a;--card:#111c33;--line:#263653;--text:#eef4ff;--muted:#9eacc5;--brand:#7c5cff;--ok:#34d399;--bad:#fb7185}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,#273b72,#0f172a 55%);color:var(--text);font:15px Inter,system-ui,sans-serif;padding:28px}.shell{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:24px;font-weight:800}.brand span{color:#a78bfa}.muted{color:var(--muted)}.card{background:rgba(17,28,51,.88);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 20px 60px #0005}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;color:var(--muted);font-weight:700;margin:4px 0 8px}input,select{width:100%;background:#0b1428;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px}input:focus,select:focus{outline:2px solid #7c5cff66;border-color:var(--brand)}.actions{margin-top:22px;display:flex;gap:12px}button{border:0;border-radius:12px;padding:13px 20px;background:linear-gradient(135deg,#7c5cff,#5b8cff);color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.ghost{background:#22304c}.alert{display:none;border-radius:12px;padding:13px;margin:18px 0}.alert.show{display:block}.success{background:#063d31;color:#9ff3d4}.error{background:#4b1728;color:#fecdd3}.log{display:none;margin-top:24px}.log.show{display:block}.log pre{max-height:430px;overflow:auto;white-space:pre-wrap;background:#080d19;border:1px solid #22304c;border-radius:14px;padding:18px;color:#b8f7d8;font:13px ui-monospace,monospace}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#243557;color:#cbd7f5;font-size:12px}@media(max-width:650px){body{padding:16px}.grid{grid-template-columns:1fr}.card{padding:20px}.top{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head>
<body><main class="shell"><header class="top"><div class="brand">🎯 <span>ONLUYEN</span> Batch</div><div class="pill">Chạy đúng 1 tài khoản · 1 bài</div></header>
<section class="card"><h1>Thực hiện bài tập</h1><p class="muted">Chọn tài khoản, nhập Log ID. Hệ thống chỉ xử lý bài được chọn và chỉ báo thành công sau khi xác nhận có đáp án.</p><div id="alert" class="alert"></div>
<form id="form"><div class="grid"><div><label for="taikhoan">Tài khoản</label><select id="taikhoan" required><option value="">Đang tải tài khoản…</option></select></div><div><label for="logid">Log ID bài tập</label><input id="logid" required placeholder="Ví dụ: 6aae9db7e2257cc11cda0d12"></div></div><div class="actions"><button id="submit">▶ Chạy bài đã chọn</button><button type="button" class="ghost" onclick="location.href='/'">← Quay lại</button></div></form>
<div id="log" class="log"><strong>Nhật ký xử lý</strong><pre id="output"></pre></div></section></main>
<script>
const $=id=>document.getElementById(id), alertBox=$('alert'), output=$('output');
function show(type,msg){alertBox.className='alert show '+type;alertBox.textContent=msg}
async function load(){try{const r=await fetch('/get-accounts'),d=await r.json();const s=$('taikhoan');s.innerHTML='<option value="">-- Chọn tài khoản --</option>';if(!d.success)throw Error(d.message);d.accounts.forEach(a=>{const o=document.createElement('option');o.value=a.email;o.textContent=`${a.name} · ${a.email}`;s.appendChild(o)})}catch(e){show('error','Không tải được tài khoản: '+e.message)}}
$('form').onsubmit=async e=>{e.preventDefault();const button=$('submit'),log=$('log');const body={logid:$('logid').value.trim(),taikhoan:$('taikhoan').value};if(!body.logid||!body.taikhoan)return show('error','Vui lòng nhập Log ID và chọn tài khoản.');button.disabled=true;button.textContent='⏳ Đang kiểm tra và nộp…';log.className='log show';output.textContent='Đang xử lý…';try{const r=await fetch('/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();output.textContent=d.log_file||d.message||'';if(d.success)show('success','✓ '+(d.status||'Đã nộp bài và xác nhận có đáp án.'));else show('error','✗ '+(d.message||'Chưa nộp thành công.'))}catch(e){show('error','Lỗi kết nối: '+e.message);output.textContent=e.stack||e.message}finally{button.disabled=false;button.textContent='▶ Chạy bài đã chọn'}};load();
</script></body></html>
