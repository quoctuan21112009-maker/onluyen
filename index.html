<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNS ACCESS — Enter Key</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00f5ff;
    --cyan-dim: rgba(0,245,255,0.12);
    --cyan-glow: rgba(0,245,255,0.4);
    --red: #ff3b3b;
    --green: #00ff88;
    --bg: #060a0f;
    --panel: rgba(0,245,255,0.04);
    --border: rgba(0,245,255,0.2);
    --text: #c8f0f5;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Share Tech Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
    pointer-events: none;
  }

  /* Scan line overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  /* Corner decorations */
  .corner {
    position: fixed;
    width: 80px;
    height: 80px;
    z-index: 1;
  }
  .corner::before, .corner::after {
    content: '';
    position: absolute;
    background: var(--cyan);
    opacity: 0.5;
  }
  .corner::before { width: 100%; height: 2px; }
  .corner::after  { width: 2px; height: 100%; }
  .corner.tl { top: 20px; left: 20px; }
  .corner.tr { top: 20px; right: 20px; transform: scaleX(-1); }
  .corner.bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
  .corner.br { bottom: 20px; right: 20px; transform: scale(-1); }

  /* Floating particles */
  .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: var(--cyan);
    border-radius: 50%;
    animation: float linear infinite;
    opacity: 0;
  }
  @keyframes float {
    0%   { opacity: 0; transform: translateY(100vh) translateX(0); }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.6; }
    100% { opacity: 0; transform: translateY(-10vh) translateX(calc(var(--drift) * 1px)); }
  }

  /* Main container */
  .container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 480px;
    padding: 20px;
    animation: fadeIn 0.8s ease forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Panel */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 40px 36px 36px;
    position: relative;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 60px rgba(0,245,255,0.05), inset 0 1px 0 rgba(0,245,255,0.1);
  }

  /* Top accent line */
  .panel::before {
    content: '';
    position: absolute;
    top: -1px; left: 40px; right: 40px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  }

  /* System label */
  .sys-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--cyan);
    opacity: 0.6;
    margin-bottom: 28px;
  }
  .sys-label::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--cyan);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
    box-shadow: 0 0 6px var(--cyan);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.3; transform: scale(0.8); }
  }

  /* Title */
  .title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 28px;
    letter-spacing: 0.1em;
    color: #fff;
    margin-bottom: 6px;
    text-shadow: 0 0 20px rgba(0,245,255,0.5);
    line-height: 1.1;
  }
  .title span { color: var(--cyan); }

  .subtitle {
    font-size: 12px;
    letter-spacing: 0.15em;
    color: rgba(200,240,245,0.4);
    margin-bottom: 36px;
  }

  /* Divider */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin-bottom: 32px;
  }

  /* Input group */
  .input-group {
    position: relative;
    margin-bottom: 16px;
  }

  .input-label {
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--cyan);
    opacity: 0.7;
    display: block;
    margin-bottom: 10px;
  }

  .key-input {
    width: 100%;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 14px 18px;
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: #fff;
    outline: none;
    transition: all 0.3s ease;
    text-transform: uppercase;
    caret-color: var(--cyan);
  }
  .key-input::placeholder {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.1em;
    color: rgba(200,240,245,0.2);
    font-weight: 400;
  }
  .key-input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 1px var(--cyan), 0 0 20px rgba(0,245,255,0.15);
    background: rgba(0,245,255,0.03);
  }

  /* Glitch border on focus */
  .input-group::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: var(--cyan);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s ease;
  }
  .input-group:focus-within::after { transform: scaleX(1); }

  /* Submit button */
  .btn-submit {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid var(--cyan);
    border-radius: 3px;
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.25em;
    color: var(--cyan);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    margin-top: 8px;
  }
  .btn-submit::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--cyan);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s ease;
    z-index: -1;
  }
  .btn-submit:hover {
    color: #000;
    box-shadow: 0 0 30px var(--cyan-glow);
    text-shadow: none;
  }
  .btn-submit:hover::before { transform: scaleX(1); }
  .btn-submit:active { transform: scale(0.98); }

  /* Loading state */
  .btn-submit.loading {
    pointer-events: none;
    opacity: 0.7;
  }
  .btn-submit.loading .btn-text { display: none; }
  .btn-submit.loading .btn-loading { display: inline-flex; align-items: center; gap: 8px; }
  .btn-loading { display: none; }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(0,245,255,0.3);
    border-top-color: var(--cyan);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Message */
  .msg {
    margin-top: 20px;
    padding: 12px 16px;
    border-radius: 3px;
    font-size: 12px;
    letter-spacing: 0.1em;
    display: none;
    align-items: center;
    gap: 10px;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg.error {
    display: flex;
    background: rgba(255,59,59,0.08);
    border: 1px solid rgba(255,59,59,0.3);
    color: #ff7070;
  }
  .msg.success {
    display: flex;
    background: rgba(0,255,136,0.08);
    border: 1px solid rgba(0,255,136,0.3);
    color: var(--green);
  }
  .msg-icon { font-size: 16px; flex-shrink: 0; }

  /* Footer */
  .footer {
    margin-top: 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: rgba(200,240,245,0.2);
  }

  /* Glitch effect on title hover */
  @keyframes glitch {
    0%, 100% { clip-path: none; transform: none; }
    20%  { clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%); transform: translate(-2px, 0); }
    40%  { clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%); transform: translate(2px, 0); }
    60%  { clip-path: none; transform: none; }
  }
  .title:hover { animation: glitch 0.4s steps(2) 1; }
</style>
</head>
<body>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="particles" id="particles"></div>

<div class="container">
  <div class="panel">
    <div class="sys-label">DNS SECURE ACCESS PORTAL</div>

    <h1 class="title"><span>DNS</span> SYSTEM</h1>
    <p class="subtitle">AUTHENTICATION REQUIRED — ENTER ACCESS KEY</p>

    <div class="divider"></div>

    <div class="input-group">
      <label class="input-label" for="keyInput">▸ ACCESS KEY</label>
      <input
        class="key-input"
        id="keyInput"
        type="text"
        maxlength="12"
        placeholder="XXXX-XXXX-XXXX"
        autocomplete="off"
        spellcheck="false"
      >
    </div>

    <button class="btn-submit" id="submitBtn" onclick="checkKey()">
      <span class="btn-text">VERIFY &amp; ACCESS</span>
      <span class="btn-loading">
        <span class="spinner"></span>
        VERIFYING...
      </span>
    </button>

    <div class="msg" id="msg">
      <span class="msg-icon" id="msgIcon"></span>
      <span id="msgText"></span>
    </div>

    <div class="footer">
      <span>DNS © 2026</span>
      <span id="statusTime"></span>
    </div>
  </div>
</div>

<script>
  /* ── 45 keys, 12 chars each ─────────────────────────── */
  const validKeys = [
    "D4K9X2M7PQNR","A8B3Z6W1YFCE","N2T5R8Q4JLHS","S7M1X9C3VBKP","G5F4H6U2RWOD",
    "X3J7N1B9QTYV","B6V2D4S8MLFA","M9C5G3T7PKXZ","Q1H8F6N2BSEW","R4U3J5X1CGDY",
    "P7W9B2M4FLKT","T2N6Q8V3DSCX","F5A1R7H9MZWJ","K8L4C2G6YPNB","W3X7F5T1QVRD",
    "L6D9B3N7SCAM","Y2G4M8X6KPFW","C9T1V5J3RQZH","H4N8A2D6XFBL","Z7Q3W9C5MYTS",
    "J1M6R4B8PGKN","V5S2T7F1HCQX","E8B4G3N9KWDM","O2X6J5A1RFTP","U7C9D8M4NQBV",
    "I3F1H6G2XWLS","NS4D7K8Q2RFM","T6B9V3C5WXJP","RK2M8N1G4FSH","QW7L3D6B9TVA",
    "FM5C2J8R4HNX","HV1P9N7B3XGQ","XN6W4T1M8DLC","BA9G5Q2F7KRS","CL3X8J6N2MVP",
    "WD7F4H9B1QRC","GQ2N5M3X8TJV","KP6B1R7C4DWN","MH8T3V9F2SAX","NB4Q7J5G1LXK",
    "YF9D2M6R8BCP","RX1V4H7N3QTG","SD5G9K2J8FBM","TP3N8W1C6VQH","LW6X4B5M9RJD"
  ];

  /* ── Particles ───────────────────────────────────────── */
  const container = document.getElementById('particles');
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.setProperty('--drift', (Math.random() - 0.5) * 120);
    p.style.animationDuration = (6 + Math.random() * 10) + 's';
    p.style.animationDelay = (Math.random() * 12) + 's';
    container.appendChild(p);
  }

  /* ── Clock ───────────────────────────────────────────── */
  function updateClock() {
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    document.getElementById('statusTime').textContent =
      `SYS ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  /* ── Auto-uppercase ──────────────────────────────────── */
  document.getElementById('keyInput').addEventListener('input', e => {
    const pos = e.target.selectionStart;
    e.target.value = e.target.value.toUpperCase();
    e.target.setSelectionRange(pos, pos);
  });

  /* ── Enter key support ───────────────────────────────── */
  document.getElementById('keyInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkKey();
  });

  /* ── Message helper ──────────────────────────────────── */
  function showMsg(type, icon, text) {
    const el = document.getElementById('msg');
    el.className = 'msg ' + type;
    document.getElementById('msgIcon').textContent = icon;
    document.getElementById('msgText').textContent = text;
  }

  /* ── IP fetch ────────────────────────────────────────── */
  async function getIP() {
    const res = await fetch('https://api.ipify.org?format=json');
    const d   = await res.json();
    return d.ip;
  }

  /* ── Main check ──────────────────────────────────────── */
  async function checkKey() {
    const key = document.getElementById('keyInput').value.trim().toUpperCase();
    const btn = document.getElementById('submitBtn');

    // Clear old message
    document.getElementById('msg').className = 'msg';

    if (!key) {
      showMsg('error', '⚠', 'VUI LÒNG NHẬP ACCESS KEY');
      return;
    }
    if (!validKeys.includes(key)) {
      showMsg('error', '✕', 'KEY KHÔNG HỢP LỆ — TRUY CẬP BỊ TỪ CHỐI');
      return;
    }

    // Loading
    btn.classList.add('loading');

    try {
      const ip    = await getIP();
      const saved = localStorage.getItem('dns_used_' + key);

      if (saved && saved !== ip) {
        showMsg('error', '⊗', 'KEY ĐÃ ĐƯỢC DÙNG TẠI IP KHÁC — LIÊN HỆ ADMIN');
        btn.classList.remove('loading');
        return;
      }

      localStorage.setItem('dns_used_' + key, ip);
      showMsg('success', '✓', 'XÁC THỰC THÀNH CÔNG — ĐANG CHUYỂN HƯỚNG...');

      setTimeout(() => {
        window.location.href = 'https://onluyen.onrender.com';
      }, 1200);
    } catch (err) {
      showMsg('error', '!', 'LỖI KẾT NỐI — THỬ LẠI SAU');
      btn.classList.remove('loading');
    }
  }
</script>
</body>
</html>
